<!DOCTYPE html>
<html>

<head>

    <title>Login - AI Study Assistant</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="form-box">

    <h1>🔐 Login</h1>

    <p>Welcome back!</p>

    {% if message %}
        <p class="message">{{ message }}</p>
    {% endif %}

    <form method="POST">

        <input type="email"
               name="email"
               placeholder="Enter Email"
               required>

        <input type="password"
               name="password"
               placeholder="Enter Password"
               required>

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        Don't have an account?
        <a href="/register">Register</a>
    </p>

</div>

</body>
</html>
